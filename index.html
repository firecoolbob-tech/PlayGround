text('PROGRESS  '+String(Math.min(save.unlocked,13)).padStart(2,'0')+' / 13',50,H-31,9,'#8ca2bc',800);text('NEON//APEX  •  TOUCH READY',W-50,H-31,9,'#687f9b',800,'right');}

function drawEditor(){drawRaceScene(false);ctx.fillStyle='rgba(3,6,16,.72)';ctx.fillRect(0,0,W,H);panel(W*.25,16,W*.5,66);text('CUSTOM HUD LAYOUT',W/2,38,16,'#eff8ff',900,'center');text('DRAG a control to move  •  drag its small corner to resize',W/2,60,9,'#92a7c3',700,'center');button(20,18,96,38,'DONE','SAVE',()=>{persist();screen='settings'},'#65f4ff');button(W-136,18,116,38,'RESET HUD','DEFAULTS',()=>{save.layout={};persist()},'#ff82d9');drawControls(true);}
function drawRaceScene(withHud=true){if(!trackPts.length)makeTrack();ctx.fillStyle=tracks[trackIndex][5];ctx.fillRect(0,0,W,H);let camX=player?player.x:0,camY=player?player.y:0,zoom=Math.min(W/1000,H/650)*1.3;zoom=clamp(zoom,.62,1.25);ctx.save();ctx.translate(W/2-camX*zoom,H/2-camY*zoom);ctx.scale(zoom,zoom);

function inputUpdate(){let k=input.keys, steer=0;if(k.ArrowLeft||k.a)steer-=1;if(k.ArrowRight||k.d)steer+=1;let pids=Array.from(input.pointers.values());for(const p of pids){if(p.control==='LEFT')steer-=1;if(p.control==='RIGHT')steer+=1}if(save.settings.mode==='swipe'&&input.swipe){steer=clamp(input.swipe.dx/(W*.21),-1,1)}if(save.settings.invert)steer=-steer;input.steer=steer;input.gas=!!(k.ArrowUp||k.w||pids.some(p=>p.control==='GAS'));input.brake=!!(k.ArrowDown||k.s||pids.some(p=>p.control==='BRAKE'));input.drift=!!(k[' ']||pids.some(p=>p.control==='DRIFT'));input.nitro=!!(k.Shift||k.ShiftLeft||pids.some(p=>p.control==='NITRO'))}
function update(dt){now+=dt*1000;if(screen!=='race'||!running)return;inputUpdate();raceTime+=dt;lapTime+=dt;const p=player;let speed=hypot(p.vx,p.vy),forward=p.vx*Math.cos(p.a)+p.vy*Math.sin(p.a),steer=input.steer;let accel=input.gas?360:0;if(input.brake)accel-=470;if(input.nitro&&p.nitro>0&&input.gas){accel+=680;p.nitro=Math.max(0,p.nitro-28*dt)}else p.nitro=Math.min(100,p.nitro+7*dt);let maxSpeed=input.nitro&&input.gas?510:360;let turnRate=(.9+Math.min(1,speed/150)*1.1)*save.settings.sensitivity;p.a+=steer*turnRate*dt*(forward>=0?1:-1);let fx=Math.cos(p.a),fy=Math.sin(p.a),sideX=-fy,sideY=fx;p.vx+=fx*accel*dt;p.vy+=fy*accel*dt;let traction=input.drift?.965:.82;let lateral=p.vx*sideX+p.vy*sideY;p.vx-=sideX*lateral*(1-traction);p.vy-=sideY*lateral*(1-traction);let drag=(input.gas||input.brake)?0.992:0.984;p.vx*=Math.pow(drag,dt*60);p.vy*=Math.pow(drag,dt*60);speed=hypot(p.vx,p.vy);if(speed>maxSpeed){p.vx*=maxSpeed/speed;p.vy*=maxSpeed/speed}p.x+=p.vx*dt;p.y+=p.vy*dt;

function canvasPos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

if(screen==='menu'){let compact=W<760,left=48,top=compact?118:140,rw=compact?W-96:Math.min(520,W*.48),rh=compact?Math.min(H-270,340):H-230;let cols=compact?1:2,cardH=compact?72:62,gap=8,pad=20,cardW=(rw-pad*2-gap*(cols-1))/cols,listY=top+66,rows=Math.min(compact?3:4,Math.max(1,Math.floor((rh-82)/(cardH+gap))));for(let n=0;n<13;n++){let col=n%cols,row=Math.floor(n/cols)-menuScroll;if(row<0||row>=rows)continue;let bx=left+pad+col*(cardW+gap),by=listY+row*(cardH+gap);if(hit(p.x-bx,p.y-by,cardW,cardH)&&n+1<=save.unlocked){trackIndex=n;return}}let sideX=left+rw+24,sideW=W-sideX-42;if(sideW>145&&p.x>=sideX&&p.y>top+Math.min(244,H*.38)&&p.y<top+Math.min(303,H*.49)){if(trackIndex+1<=save.unlocked)startRace(trackIndex);return}if(sideW>145&&p.x>=sideX&&p.y>top+Math.min(303,H*.49)&&p.y<top+Math.min(345,H*.56)){screenReturn='menu';screen='settings';return}if(sideW<=145&&p.y>H-90&&p.y<H-35){if(p.x>W-205)startRace(trackIndex);return}if(sideW<=145&&p.y>H-38&&p.x>W-205){screenReturn='menu';screen='settings';return}if(rw>0&&p.x>left&&p.x<left+rw&&p.y>top+rh-24){menuScroll=clamp(menuScroll+1,0,4);return}if(p.y<top+70&&p.x>W-100)menuScroll=menuScroll?menuScroll-1:0;}}
