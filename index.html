<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>Breakout — Neon Ball Arcade</title>
  <meta name="description" content="A simple, fast, neon ball breakout game. Bounce, break, chain combos, and chase your best score.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b18'/%3E%3Ccircle cx='32' cy='38' r='11' fill='%23e8fbff'/%3E%3Ccircle cx='32' cy='38' r='15' fill='none' stroke='%2338d9ff' stroke-width='3' opacity='.7'/%3E%3Crect x='14' y='12' width='10' height='6' rx='2' fill='%23ff4d8d'/%3E%3Crect x='27' y='12' width='10' height='6' rx='2' fill='%23ffd93d'/%3E%3Crect x='40' y='12' width='10' height='6' rx='2' fill='%2338d9ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="brand" aria-hidden="true">
        <span class="brand-mark"><i></i></span>
        <span class="brand-name">BREAKOUT</span>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">SCORE</span>
          <strong id="score" class="stat-value">0</strong>
        </div>
        <div class="stat stat-level">
          <span class="stat-label">LEVEL</span>
          <strong id="level" class="stat-value">1</strong>
        </div>
        <div class="stat stat-lives">
          <span class="stat-label">LIVES</span>
          <div id="lives" class="lives" aria-label="3 lives"></div>
        </div>
      </div>

      <div class="actions">
        <button id="sound-btn" class="icon-btn" type="button" aria-label="Mute sound" title="Sound on">
          <span class="icon" data-icon="sound"></span>
        </button>
        <button id="pause-btn" class="icon-btn" type="button" aria-label="Pause game" title="Pause" disabled>
          <span class="icon" data-icon="pause"></span>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="game" width="900" height="640" aria-label="Ball breakout playfield. Move the paddle and bounce the ball into the neon bricks."></canvas>

      <div class="combo-chip" id="combo" hidden aria-live="off">COMBO <b>×2</b></div>
      <div class="effect-chips" id="effects" aria-live="off"></div>
      <div class="launch-hint" id="launch-hint" hidden><span class="hint-dot"></span><span class="hint-desktop">CLICK OR PRESS SPACE TO LAUNCH</span><span class="hint-mobile">TAP TO LAUNCH</span></div>

      <div class="banner" id="banner" hidden>
        <span class="banner-kicker">LEVEL 1</span>
        <strong>TOPPED OUT</strong>
        <em>+0</em>
      </div>

      <div class="overlay" id="overlay">
        <div class="panel" id="panel"></div>
      </div>
    </main>

    <footer class="foot">
      <span class="foot-hint foot-desktop">
        <kbd>MOUSE</kbd><span>or</span><kbd>A</kbd><kbd>D</kbd><span>to move</span>
        <i></i>
        <kbd>SPACE</kbd><span>launch</span>
        <i></i>
        <kbd>P</kbd><span>pause</span>
      </span>
      <span class="foot-hint foot-mobile">DRAG TO MOVE<i></i>TAP TO LAUNCH</span>
      <span class="foot-tag">NEON ARCADE · 01</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
