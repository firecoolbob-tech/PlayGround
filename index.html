<style>

kground:transparent;color:#8197a9;font-size:11px;font-weight:750;padding:9px 13px;border-radius:9px}.tab.active{color:#bcffe7;background:#143328;border-color:#1d5545}.panel{background:#0c1926;border:1px solid #1c3041;border-radius:16px;padding:16px}.sidecol .panel{margin-bottom:13px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.panel-title h3{margin:0;font-size:13px}.panel-title span{font-size:9px;color:#7f95a8}.progress{height:5px;background:#1a2c3c;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#35bb9d,#83f7cf);width:40%}.champ-card{padding:13px;border-radius:12px;background:linear-gradient(110deg,#182b3a,#122331);border:1px solid #263c4e;margin-bottom:8px}.champ-card.active{border-color:#47d9ae77;background:linear-gradient(110deg,#15352e,#112934)}.champ-head{display:flex;justify-content:space-between;align-items:center}.champ-head b{font-size:11px}.badge{font-size:8px;font-weight:900;letter-spacing:.07em;padding:4px 6px;border-radius:5px;background:#1f3547;color:#9eb1c0}.badge.open{background:#123d32;color:#80ebc5}.champ-card p{font-size:9px;color:#8ea4b6;margin:7px 0 10px}.btn{border:0;border-radius:8px;padding:9px 12px;background:linear-gradient(120deg,#73efc3,#38cfa5);color:#06241c;font-size:10px;font-weight:900}.btn.secondary{border:1px solid #2b4355;background:#16293a;color:#c5d7e3}.btn.tiny{padding:7px 10px}.btn.goldbtn{background:linear-gradient(120deg,#ffd989,#eea842);color:#2c200b}.smallrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#8299ab;font-size:10px}.subtle{font-size:9px;color:#71889b}.row{display:flex;gap:8px;align-items:center}.divider{height:1px;background:#1c3041;margin:13px 0}.view{display:none}.view.active{display:block}.upgrade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.upgrade-card{background:#102131;border:1px solid #20394c;border-radius:13px;padding:13px}.upgrade-card h4{margin:0 0 4px;font-size:12px}.upgrade-card p{margin:0 0 9px;font-size:9px;color:#8199ab}.upgrade-actions{display:flex;gap:5px;align-items:center}.upgrade-actions .btn{flex:1;padding:8px 4px}.pack-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.pack-card{border:1px solid #243b4e;background:linear-gradient(145deg,#15283a,#0e1c2a);border-radius:14px;padding:14px;text-align:center;position:relative;overflow:hidden}.pack-icon{height:73px;width:62px;margin:2px auto 10px;border-radius:10px 10px 14px 14px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,var(--pack1),var(--pack2));box-shadow:0 10px 28px color-mix(in srgb,var(--pack2),transparent 65%),inset 0 1px 2px #ffffff90;transform:skewY(-4deg)}.pack-card h3{font-size:11px;margin:0 0 4px}.pack-card p{margin:0 0 10px;color:#8298aa;font-size:9px}.pack-card .row{justify-content:center;flex-wrap:wrap}.world-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.world-card{min-height:91px;border:1px solid #23394b;border-radius:12px;padding:11px;background:linear-gradient(145deg,#122538,#0c1925);position:relative;overflow:hidden}.world-card::after{content:"";position:absolute;right:-20px;bottom:-38px;width:100px;height:75px;border-radius:50%;background:var(--world);filter:blur(22px);opacity:.2}.world-card h4{margin:7px 0 4px;font-size:10px;position:relative;z-index:1}.world-card span{font-size:8px;color:#8499aa;position:relative;z-index:1}.world-card button{position:absolute;right:8px;top:8px;border:0;background:#112130b9;color:#c2d2de;border-radius:6px;padding:4px 6px;font-size:8px;z-index:2}.world-card.locked{opacity:.52;filter:saturate(.6)}.garage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.car-card{border:1px solid #22384a;background:#102131;border-radius:13px;padding:11px;position:relative}.car-art{height:68px;border-radius:9px;background:linear-gradient(145deg,#1d3445,#0d1c29);display:grid;place-items:center;margin-bottom:9px;font-size:30px;position:relative;overflow:hidden}.car-art::after{content:"";position:absolute;bottom:7px;width:70px;height:10px;background:#9eead550;filter:blur(7px);border-radius:50%}.car-card h4{font-size:10px;margin:0 0 4px}.car-card p{font-size:8px;color:#8298aa;margin:0 0 7px}.car-card .star{position:absolute;top:7px;right:8px;color:#ffce6b;font-size:10px}.rarity{font-size:8px;color:#8ca3b5}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,25px);opacity:0;pointer-events:none;background:#d8fff1;color:#0b3025;padding:11px 16px;border-radius:10px;font-size:11px;font-weight:800;z-index:30;box-shadow:0 12px 40px #0008;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;display:none;place-items:center;background:#030a10c9;backdrop-filter:blur(10px);z-index:20;padding:18px}.modal.show{display:grid}.modal-card{width:min(440px,100%);background:linear-gradient(145deg,#172b3b,#0b1722);border:1px solid #426078;border-radius:20px;padding:25px;text-align:center;box-shadow:0 30px 100px #000a}.modal-card h2{font-size:24px;margin:0 0 8px}.reveal-card{margin:20px auto;padding:24px;border:1px solid #48977f;border-radius:15px;background:linear-gradient(135deg,#164331,#10283a);animation:pop .5s ease both}.reveal-card .emoji{font-size:50px}.reveal-card strong{display:block;font-size:18px;margin-top:8px}@keyframes pop{from{transform:scale(.55) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}.footer{margin-top:16px;color:#60788a;font-size:9px;text-align:center}@media(max-width:980px){.layout{grid-template-columns:1fr}.sidecol{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sidecol .panel{margin-bottom:0}.hero{height:350px}}@media(max-width:620px){.shell{padding:12px}.topbar{margin-bottom:12px}.pills{gap:5px}.pill{padding:7px 8px;font-size:10px}.pill span{display:none}.layout{gap:12px}.hero{height:330px}.scene-controls{top:52px;left:14px;right:auto}.race-bottom{padding:55px 14px 14px}.race-title h1{font-size:22px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:10px}.stat strong{font-size:16px}.sidecol{grid-template-columns:1fr}.upgrade-grid{grid-template-columns:1fr}.pack-grid{grid-template-columns:repeat(2,1fr)}.world-grid{grid-template-columns:repeat(2,1fr)}.garage-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="app"></div><script>
const worlds=[['Metro City','🌆','#29b7d1','Wet asphalt · skyline'],['Neon Cyberway','🌐','#db48ff','Holograms · neon grid'],['Desert Canyon','🏜️','#f3a64b','Sun-baked highway'],['Alpine Snow','🏔️','#b8e3ff','Icy curves · pines'],['Frozen Lake','🧊','#80d7ff','Mirror ice · snow spray'],['Tropical Coast','🌴','#31d4b0','Ocean boardwalk'],['Volcanic Ridge','🌋','#ff633d','Obsidian · lava rivers'],['Industrial Port','🏗️','#e0a455','Steel docks · containers'],['Jungle Temple','🌿','#56ce83','Mossy ruins'],['Moon Crater','🌙','#a4a8d1','Low gravity · lunar dust'],['Candy Kingdom','🍭','#ff80c8','Sugar road · pastel'],['Golden Vault','👑','#ffce67','Gilded marble'],['Sunset Highway','🌅','#ff995e','Coastal golden hour'],['Rainy Expressway','🌧️','#67bff0','Heavy rain · puddles'],['Cherry Blossom Touge','🌸','#ff9ebd','Hairpins · falling petals'],['Crystal Cavern','💎','#70ffe0','Bioluminescent crystals'],['Autumn Forest','🍂','#dd8b43','Leaf-covered country road'],['Mars Colony','🔴','#f17c55','Red dust · solar arrays'],['Skyway Cloudbridge','☁️','#8ad8ff','Glass road above clouds'],['Haunted Hollow','🎃','#a388d4','Misty cobblestone'],['Prism Void','🌈','#d688ff','Iridescent rainbow road']];
const tiers=[{name:'Rookie Cup',laps:3,req:0,reward:40,trophies:12},{name:'Street League',laps:4,req:1,reward:140,trophies:32},{name:'Pro Grand Prix',laps:5,req:2,reward:480,trophies:85},{name:'Elite Tour',laps:6,req:3,reward:1600,trophies:220},{name:'World Apex Championship',laps:8,req:4,reward:6000,trophies:650}];
const cars=[['Comet S','Compact Coupe','🚙','Common'],['V8 Raptor','Muscle GT','🏎️','Rare'],['Crown Interceptor','Police Interceptor','🚓','Rare'],['Trail Boss','Pickup Truck','🛻','Common'],['Sidewinder','Drift Van','🚐','Epic'],['Pocket Rocket','RC Buggy','🏁','Common'],['Dune Raider','Off-Roader','🚜','Rare'],['Aurelia GT','Mid-Engine Supercar','🏎️','Epic'],['Apex F1','Formula Racer','🏎️','Legendary'],['Retro Nova','Classic Coupe','🚗','Common'],['Nightshift','Street Racer','🚘','Rare'],['Volt Runner','Electric Hypercar','⚡','Epic'],['Rally Fox','Rally Hatchback','🚗','Rare'],['Roadster 88','Open Roadster','🚘','Rare'],['Titan Hauler','Heavy Truck','🚚','Epic'],['Skyline X','Hypercar','🏎️','Legendary'],['Rookie Kart','Track Kart','🏎️','Common'],['Phantom GT','Luxury Coupe','🚘','Epic']];
const packDefs=[{name:'Standard Pack',icon:'📦',colors:['#55d8ac','#176e6e'],cost:140,trophies:0,weights:[65,25,9,1]},{name:'Pro Pack',icon:'🎴',colors:['#55b8ff','#3648ab'],cost:850,trophies:0,weights:[35,40,21,4]},{name:'Neon Pack',icon:'💠',colors:['#e860ff','#693fd7'],cost:2400,trophies:22,weights:[15,35,38,12]},{name:'Legendary Pack',icon:'👑',colors:['#ffce67','#dc6545'],cost:0,trophies:90,weights:[4,16,42,38]}];
const statDefs=[['speed','Top Speed','Higher cruising speed'],['accel','Acceleration','Faster lap pace'],['grip','Cornering Grip','More drift efficiency'],['nitro','Nitro Boost','Bigger burst bonus'],['payout','Race Payout','More cash per lap']];
const fresh=()=>({cash:650,trophies:0,xp:0,level:1,laps:0,world:0,car:0,upgrades:{speed:0,accel:0,grip:0,nitro:0,payout:0},collection:{0:1},skins:0,prestige:0,unlockedTier:0,won:[],worlds:[0],speedMult:1,follow:true,sound:true,last:Date.now(),champ:null});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem('pitlane-save')||'{}')};state.upgrades={...fresh().upgrades,...state.upgrades};state.collection=state.collection||{0:1};state.worlds=state.worlds||[0];}catch{state=fresh()}
let tab='race',buyMode=1,ctx=null,toastTimer,champTimer=0,sceneTime=0,lastTick=Date.now();
const $=s=>document.querySelector(s),fmt=n=>Math.floor(n).toLocaleString(),save=()=>{state.last=Date.now();localStorage.setItem('pitlane-save',JSON.stringify(state))};
function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function sound(type='tap'){if(!state.sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);const now=ctx.currentTime,notes={tap:[440,.05],upgrade:[660,.13],pack:[520,.23],lap:[740,.1],win:[880,.4]};osc.frequency.setValueAtTime(notes[type][0],now);osc.frequency.exponentialRampToValueAtTime(notes[type][0]*1.45,now+notes[type][1]);osc.type=type==='win'?'triangle':'sine';gain.gain.setValueAtTime(.055,now);gain.gain.exponentialRampToValueAtTime(.001,now+notes[type][1]);osc.start(now);osc.stop(now+notes[type][1])}catch{}}
const rate=()=> (1+state.upgrades.payout*.16)*(1+state.prestige*.18)*(1+state.car*.018)*(1+Math.max(0,state.skins)*.02);
const lapSeconds=()=>Math.max(8,30-state.upgrades.speed*1.1-state.upgrades.accel*.9-state.upgrades.grip*.45-state.upgrades.nitro*.3);
function addXp(n){state.xp+=n;while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;state.cash+=120;notify('Level up! +$120 bonus')}}
function render(){const car=cars[state.car]||cars[0],world=worlds[state.world]||worlds[0],xpPct=state.xp/(state.level*100)*100;const unlock=i=>i<=state.unlockedTier;const nav=[['race','Race'],['upgrades','Upgrades'],['packs','Card Packs'],['garage','Garage'],['worlds','21 Worlds']];
$('#app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="brandmark">◈</div><div>PITLANE<small>idle racing club</small></div></div><div class="pills"><div class="pill cash">◉ <span>Cash</span><b id="cashBalance">$${fmt(state.cash)}</b></div><div class="pill trophy">✦ <span>Trophies</span><b id="trophyBalance">${fmt(state.trophies)}</b></div><div class="pill">✧ <span>Level</span><b>${state.level}</b></div><div class="profile">${car[0][0]}</div></div></header>
<div class="layout"><main class="maincol"><section class="hero"><canvas id="raceCanvas"></canvas><div class="scene-top"><span class="live">● LIVE RACE</span><span class="trackname">${world[1]} &nbsp; ${world[0]}</span></div><div class="scene-controls"><button data-action="camera" class="${state.follow?'active':''}">${state.follow?'◉ FOLLOW':'▧ FULL TRACK'}</button><button data-action="sound" class="${state.sound?'active':''}">${state.sound?'♫ SOUND':'♫ MUTED'}</button></div><div class="race-bottom"><div class="race-title"><h1>${car[0]}</h1><p>${car[1]} <span style="color:#617e91"> · </span><strong>+${fmt(16*rate()/lapSeconds())}/sec</strong></p></div><div class="lapbox"><span>COMPLETED LAPS</span><b id="lapCount">${fmt(state.laps)}</b><div class="speed-row">${[1,2,4].map(v=>`<button data-speed="${v}" class="${state.speedMult===v?'active':''}">${v}×</button>`).join('')}</div></div></div></section>
<div class="stats"><div class="stat"><div class="label">Cash / lap</div><strong class="mint">$${fmt(16*rate())}</strong><small>payout x${rate().toFixed(2)}</small></div><div class="stat"><div class="label">Lap time</div><strong>${lapSeconds().toFixed(1)}s</strong><small>auto racing</small></div><div class="stat"><div class="label">Experience</div><strong>${fmt(state.xp)} <small> / ${state.level*100} XP</small></strong><div class="progress"><i style="width:${xpPct}%"></i></div></div><div class="stat"><div class="label">Pit crew</div><strong class="gold">${state.prestige} ✦</strong><small>permanent bonus</small></div></div>
<div class="tabs">${nav.map(([key,label])=>`<button class="tab ${tab===key?'active':''}" data-tab="${key}">${label}</button>`).join('')}</div><div class="panel view ${tab==='race'?'active':''}" id="view-race"><div class="section-head" style="margin-top:0"><h2>Track session</h2><span>AFK earnings are always on</span></div><div class="smallrow"><div><b style="font-size:12px">${world[0]} • ${world[3]}</b><div class="muted" style="margin-top:5px">${fmt(16*rate())} cash and 3 XP each completed lap</div></div><button class="btn secondary" data-tab="worlds">Change world →</button></div><div class="divider"></div><div class="smallrow"><div><b style="font-size:11px">Pit Crew Prestige</b><div class="muted" style="margin-top:4px">Reset cash and upgrades for permanent wrench bonuses.</div></div><button class="btn goldbtn" data-action="prestige" ${state.unlockedTier<3?'disabled':''}>Prestige</button></div><div class="subtle" style="margin-top:9px">${state.unlockedTier<3?'Unlock Elite Tour to prestige.':'Available! Your collection and worlds are preserved.'}</div></div>
<div class="panel view ${tab==='upgrades'?'active':''}" id="view-upgrades"><div class="section-head" style="margin-top:0"><h2>Performance upgrades</h2><span>Buy ${buyMode} at a time</span></div><div class="smallrow" style="margin-bottom:13px"><span class="muted">Upgrade your ride to shave seconds off every lap.</span><div class="row"><button class="btn tiny ${buyMode===1?'':'secondary'}" data-buy="1">×1</button><button class="btn tiny ${buyMode===10?'':'secondary'}" data-buy="10">×10</button></div></div><div class="upgrade-grid">${statDefs.map(([key,name,desc],i)=>{const lv=state.upgrades[key],cost=upgradeCost(key,buyMode);return `<article class="upgrade-card"><div class="smallrow"><h4>${['⚡','🚀','〰️','🔥','💰'][i]} ${name}</h4><span class="badge">LV ${lv}</span></div><p>${desc} · +${key==='payout'?'16%':'3%'} per level</p><div class="upgrade-actions"><span class="subtle">$${fmt(cost)}</span><button class="btn tiny" data-upgrade="${key}">UPGRADE</button></div></article>`}).join('')}</div></div>
<div class="panel view ${tab==='packs'?'active':''}" id="view-packs"><div class="section-head" style="margin-top:0"><h2>Card pack shop</h2><span>18 cars to collect</span></div><div class="pack-grid">${packDefs.map((p,i)=>`<article class="pack-card" style="--pack1:${p.colors[0]};--pack2:${p.colors[1]}"><div class="pack-icon">${p.icon}</div><h3>${p.name}</h3><p>${i===0?'1 card · starter odds':i===1?'2 cards · better odds':i===2?'3 cards · neon odds':'4 cards · legendary odds'}</p><div class="row"><button class="btn tiny" data-pack="${i}" data-currency="cash" ${p.cost===0?'disabled':''}>$${fmt(p.cost)}</button>${p.trophies?`<button class="btn tiny goldbtn" data-pack="${i}" data-currency="trophy">${p.trophies} ✦</button>`:''}</div></article>`).join('')}</div><div class="subtle" style="margin-top:11px">Duplicates add card shards. Collect 3 copies to star-up and equip your best ride in Garage.</div></div>
<div class="panel view ${tab==='garage'?'active':''}" id="view-garage"><div class="section-head" style="margin-top:0"><h2>Your garage</h2><span>${Object.keys(state.collection).length} / ${cars.length} discovered</span></div><div class="garage-grid">${cars.map((c,i)=>{const count=state.collection[i]||0,stars=Math.max(0,Math.floor(count/3));return `<article class="car-card"><span class="star">${stars?'★'.repeat(Math.min(3,stars)):'☆'}</span><div class="car-art">${c[2]}</div><h4>${c[0]} ${state.car===i?'✓':''}</h4><p>${c[1]}</p><div class="smallrow"><span class="rarity">${c[3]} · ×${count}</span>${count?`<button class="btn tiny" data-equip="${i}">${state.car===i?'EQUIPPED':'EQUIP'}</button>`:'<span class="badge">LOCKED</span>'}</div></article>`}).join('')}</div><div class="divider"></div><div class="smallrow"><div><b style="font-size:11px">Paint & skin packs</b><div class="muted">${state.skins} finishes owned · metallic, pearl, prism</div></div><button class="btn secondary" data-action="skin">Buy skin · $${fmt(600*Math.pow(2,state.skins))}</button></div></div>
<div class="panel view ${tab==='worlds'?'active':''}" id="view-worlds"><div class="section-head" style="margin-top:0"><h2>World select</h2><span>${state.worlds.length} / 21 unlocked</span></div><div class="world-grid">${worlds.map((w,i)=>{const open=state.worlds.includes(i);const price=i===0?0:250*Math.pow(1.7,i);return `<article class="world-card ${open?'':'locked'}" style="--world:${w[2]}"><button data-world="${i}" ${open?'':'data-cost="'+Math.floor(price)+'"'}>${open?(i===state.world?'RACING':'SELECT'):'$'+fmt(price)}</button><h4>${w[1]} ${w[0]}</h4><span>${w[3]}</span></article>`}).join('')}</div></div>
<div class="footer">Your pit crew saves automatically · Offline earnings accrue for up to 12 hours</div></main>
<aside class="sidecol"><section class="panel"><div class="panel-title"><h3>Championship ladder</h3><span>${state.won.length}/5 WON</span></div>${tiers.map((t,i)=>`<div class="champ-card ${i===state.unlockedTier?'active':''}"><div class="champ-head"><b>${t.name}</b><span class="badge ${unlock(i)?'open':''}">${state.won.includes(i)?'CLEARED':unlock(i)?'READY':'LOCKED'}</span></div><p>${t.laps} laps · ${fmt(t.trophies)} trophies · $${fmt(t.reward)}</p>${unlock(i)&&!state.won.includes(i)?`<button class="btn tiny" data-champ="${i}">${state.champ===i?'RACE IN PROGRESS':'ENTER RACE →'}</button>`:state.won.includes(i)?'<span class="subtle">Championship complete</span>':`<span class="subtle">Win ${tiers[i-1]?.name||'previous cup'} to unlock</span>`}</div>`).join('')}</section>
<section class="panel"><div class="panel-title"><h3>Race rewards</h3><span>LIVE</span></div><div class="smallrow"><span class="muted">Cash per second</span><b class="mint">$${(16*rate()/lapSeconds()).toFixed(1)}</b></div><div class="divider"></div><div class="smallrow"><span class="muted">Cash per lap</span><b>$${fmt(16*rate())}</b></div><div class="smallrow" style="margin-top:9px"><span class="muted">Next lap</span><b id="countdown">${lapSeconds().toFixed(1)}s</b></div><div class="progress" style="margin-top:8px"><i id="lapProgress" style="width:0%"></i></div></section>
<section class="panel"><div class="panel-title"><h3>Garage snapshot</h3><span>CAR ${String(state.car+1).padStart(2,'0')}</span></div><div class="smallrow"><span>${car[2]} &nbsp; ${car[0]}</span><button class="btn secondary tiny" data-tab="garage">VIEW</button></div><div class="divider"></div><div class="smallrow"><span class="muted">Collection</span><b>${Object.keys(state.collection).length} / ${cars.length}</b></div><div class="smallrow" style="margin-top:8px"><span class="muted">Paint finishes</span><b>${state.skins}</b></div></section></aside></div></div><div id="toast" class="toast"></div><div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>`;
startScene();}
function upgradeCost(key,n=1){let base={speed:70,accel:85,grip:95,nitro:130,payout:180}[key],lv=state.upgrades[key],sum=0;for(let i=0;i<n;i++)sum+=base*Math.pow(1.55,lv+i);return Math.floor(sum)}
function handleClick(e){const b=e.target.closest('button');if(!b)return;const a=b.dataset;
if(a.tab){tab=a.tab;render();return}if(a.speed){state.speedMult=+a.speed;save();sound();render();return}if(a.buy){buyMode=+a.buy;render();return}if(a.action==='camera'){state.follow=!state.follow;save();sound();render();return}if(a.action==='sound'){state.sound=!state.sound;save();sound('tap');render();return}
if(a.upgrade){const cost=upgradeCost(a.upgrade,buyMode);if(state.cash<cost)return notify('Not enough cash for that upgrade.');state.cash-=cost;state.upgrades[a.upgrade]+=buyMode;addXp(buyMode*8);sound('upgrade');notify(`${a.upgrade[0].toUpperCase()+a.upgrade.slice(1)} upgraded to level ${state.upgrades[a.upgrade]}`);save();render();return}
if(a.champ!==undefined){const i=+a.champ;if(state.champ===i){notify('Your race is already underway!');return}if(i>state.unlockedTier)return;state.champ=i;champTimer=0;notify(`${tiers[i].name} started — beat the rival!`);sound('tap');save();render();return}
if(a.pack!==undefined){const p=packDefs[+a.pack],currency=a.currency;if(currency==='cash'&&state.cash<p.cost)return notify('Not enough cash.');if(currency==='trophy'&&state.trophies<p.trophies)return notify('Not enough trophies.');if(currency==='cash')state.cash-=p.cost;else state.trophies-=p.trophies;const amount=+a.pack+1;let pulls=[];for(let n=0;n<amount;n++){const r=Math.random()*100,w=p.weights;let rarity=r<w[0]?'Common':r<w[0]+w[1]?'Rare':r<w[0]+w[1]+w[2]?'Epic':'Legendary';const pool=cars.map((c,i)=>({c,i})).filter(x=>x.c[3]===rarity);if(!pool.length)pool=cars.map((c,i)=>({c,i}));const got=pool[Math.floor(Math.random()*pool.length)];state.collection[got.i]=(state.collection[got.i]||0)+1;pulls.push({...got,rarity})}addXp(20*amount);sound('pack');save();showPack(pulls);return}
if(a.equip!==undefined){const i=+a.equip;if((state.collection[i]||0)<1)return;state.car=i;notify(`${cars[i][0]} equipped`);sound();save();render();return}
if(a.world!==undefined){const i=+a.world;if(state.worlds.includes(i)){state.world=i;notify(`${worlds[i][0]} selected`);save();render();return}const cost=+a.cost;if(state.cash<cost)return notify('Not enough cash to unlock this world.');state.cash-=cost;state.worlds.push(i);state.world=i;notify(`${worlds[i][0]} unlocked!`);sound('upgrade');save();render();return}
if(a.action==='skin'){const cost=600*Math.pow(2,state.skins);if(state.cash<cost)return notify('Not enough cash for a new finish.');state.cash-=cost;state.skins++;sound('upgrade');notify(['Metallic','Pearl clear-coat','Prism chrome','Aurora'][Math.min(3,state.skins-1)]+' finish unlocked!');save();render();return}
if(a.action==='prestige'){if(state.unlockedTier<3)return notify('Reach Elite Tour first.');if(!confirm('Reset cash, trophies and upgrades for a permanent Golden Wrench? Cars, worlds, and wins stay.'))return;state.prestige++;state.cash=250;state.trophies=0;state.upgrades={speed:0,accel:0,grip:0,nitro:0,payout:0};state.unlockedTier=0;state.won=[];state.champ=null;notify(`Prestige complete! Golden Wrench ${state.prestige} earned.`);sound('win');save();render();return}
}
function showPack(pulls){const modal=$('#modal'),card=$('#modalCard');let index=0;const reveal=()=>{const p=pulls[index];card.innerHTML=`<div class="subtle">CARD ${index+1} OF ${pulls.length}</div><h2>Pack opened!</h2><div class="reveal-card" style="border-color:${p.rarity==='Legendary'?'#ffce67':p.rarity==='Epic'?'#d86dff':p.rarity==='Rare'?'#69bfff':'#55d8ac'}"><div class="emoji">${p.c[2]}</div><strong>${p.c[0]}</strong><span class="rarity">${p.rarity} · ${p.c[1]}</span></div><div class="row" style="justify-content:center"><button class="btn" id="nextReveal">${index<pulls.length-1?'NEXT CARD →':'COLLECT CARDS'}</button></div>`;$('#nextReveal').onclick=()=>{if(index<pulls.length-1){index++;reveal()}else{modal.classList.remove('show');render()}}};modal.classList.add('show');reveal()}
$('#app').addEventListener('click',handleClick);$('#app').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
function startScene(){if(window.sceneRAF)cancelAnimationFrame(window.sceneRAF);const canvas=$('#raceCanvas'),g=canvas.getContext('2d');let w=0,h=0;function resize(){const r=canvas.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;canvas.width=w*d;canvas.height=h*d;g.setTransform(d,0,0,d,0,0)}resize();window.addEventListener('resize',resize,{once:true});const world=worlds[state.world],seed=state.world+4;function frame(ts){if(!canvas.isConnected)return;sceneTime=ts/1000;const t=sceneTime,colors=['#081423','#0b1528','#302116','#142333','#142a3b','#102a34','#211513','#16232d','#0d241a','#101326','#301930','#2b2110','#39241e','#101c2a','#291729','#0b2630','#251a19','#301b17','#1c3240','#171527','#1b1832'];const sky=colors[state.world]||'#101d2c';g.clearRect(0,0,w,h);let grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,sky);grad.addColorStop(.58,world[2]+'33');grad.addColorStop(1,'#0c1820');g.fillStyle=grad;g.fillRect(0,0,w,h);
// distant skyline / terrain silhouettes
const horizon=h*.43;g.fillStyle='#06101b99';for(let i=0;i<20;i++){const bw=(w/14)*(0.55+(i*7%5)*.11),x=(i*w/14-(t*4%w)+w)%w,bh=(.12+(Math.sin(i*17+seed)*.5+.5)*.23)*h;g.fillRect(x,horizon-bh,bw,bh);if(state.world===0||state.world===1||state.world===7){g.fillStyle=world[2]+'33';for(let yy=horizon-bh+8;yy<horizon-6;yy+=12)for(let xx=x+5;xx<x+bw-4;xx+=10)g.fillRect(xx,yy,3,4);g.fillStyle='#06101b99'}}
// glow horizon
const glow=g.createRadialGradient(w*.56,horizon,2,w*.56,horizon,w*.52);glow.addColorStop(0,world[2]+'44');glow.addColorStop(1,'transparent');g.fillStyle=glow;g.fillRect(0,horizon-100,w,h*.5);
// road, reflected ribbon perspective
const cx=w*.52,top=h*.46,bottom=h*1.03,topWidth=w*.18,bottomWidth=w*(state.follow?.62:.82);g.beginPath();g.moveTo(cx-topWidth/2,top);g.lineTo(cx+topWidth/2,top);g.lineTo(cx+bottomWidth/2,bottom);g.lineTo(cx-bottomWidth/2,bottom);g.closePath();let road=g.createLinearGradient(0,top,0,bottom);road.addColorStop(0,'#1c3441');road.addColorStop(.5,state.world===4||state.world===18?'#46515b':'#25343a');road.addColorStop(1,'#101820');g.fillStyle=road;g.fill();g.strokeStyle=world[2]+'88';g.lineWidth=2;g.stroke();
// edge highlights, racing lane
for(let side of [-1,1]){g.beginPath();g.moveTo(cx+side*topWidth*.43,top);g.lineTo(cx+side*bottomWidth*.43,bottom);g.strokeStyle=world[2]+'b0';g.lineWidth=2;g.shadowColor=world[2];g.shadowBlur=12;g.stroke();g.shadowBlur=0}
const perspective=(y)=>topWidth/2+(bottomWidth-topWidth)/2*((y-top)/(bottom-top));g.save();g.beginPath();g.moveTo(cx-topWidth/2,top);g.lineTo(cx+topWidth/2,top);g.lineTo(cx+bottomWidth/2,bottom);g.lineTo(cx-bottomWidth/2,bottom);g.clip();for(let i=0;i<13;i++){let p=((i/13+t*.23*state.speedMult)%1),y=top+p*(bottom-top),ww=perspective(y);g.fillStyle=i%2?'#ffffff1d':world[2]+'25';g.fillRect(cx-ww*.46,y,ww*.92,Math.max(1,p*2))}for(let i=0;i<7;i++){let p=((i/7+t*.17*state.speedMult)%1),y=top+p*(bottom-top),ww=perspective(y);g.setLineDash([12*p+2,18*p+4]);g.strokeStyle='#d3ecdf88';g.lineWidth=Math.max(1,p*2);g.beginPath();g.moveTo(cx,y);g.lineTo(cx,y+16*p);g.stroke()}g.setLineDash([]);
// reflective neon/sun glints & rain
for(let i=0;i<16;i++){const p=((i*.121+t*.09)%1),x=cx+(Math.sin(i*13+seed)*.35)*perspective(top+p*(bottom-top)),y=top+p*(bottom-top);g.fillStyle=i%2?world[2]+'33':'#ffffff33';g.beginPath();g.ellipse(x,y,2+p*10,1+p*2,.1,0,Math.PI*2);g.fill()}if([0,1,13,20].includes(state.world)){g.strokeStyle='#d3efff30';for(let i=0;i<55;i++){let x=(i*67+t*95)%w,y=(i*31+t*180)%h;g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y+10);g.stroke()}}
g.restore();
// tiny scenery lamps / palms / crystals
for(let i=0;i<8;i++){const side=i%2?1:-1,p=(i/8+.15)%1,y=horizon+p*(h-horizon),dist=perspective(y),x=cx+side*(dist*.64+12),size=4+p*15;g.fillStyle=world[2]+'88';g.shadowColor=world[2];g.shadowBlur=10;g.beginPath();g.arc(x,y-size*.5,size*.35,0,Math.PI*2);g.fill();g.shadowBlur=0;g.strokeStyle='#263a42';g.lineWidth=Math.max(1,size*.18);g.beginPath();g.moveTo(x,y);g.lineTo(x,y-size);g.stroke()}
// AI and player cars, drifting path around the ribbon
function drawCar(x,y,s,color,angle=0,emoji=''){g.save();g.translate(x,y);g.rotate(angle);g.fillStyle='#0009';g.beginPath();g.ellipse(0,s*.31,s*.75,s*.2,0,0,Math.PI*2);g.fill();g.shadowColor=color;g.shadowBlur=13;g.fillStyle=color;g.beginPath();g.roundRect(-s*.55,-s*.55,s*1.1,s*.92,s*.18);g.fill();g.shadowBlur=0;g.fillStyle='#c9f3ffb0';g.beginPath();g.roundRect(-s*.32,-s*.42,s*.64,s*.32,s*.11);g.fill();g.fillStyle='#fff7bc';g.fillRect(-s*.42,s*.2,s*.19,s*.1);g.fillRect(s*.23,s*.2,s*.19,s*.1);g.restore()}
for(let i=0;i<3;i++){let p=((t*(.09+i*.009)*state.speedMult+i*.31)%1),y=top+p*(h*.62),width=perspective(y),x=cx+Math.sin(t*.65+i*2.7)*width*.19;drawCar(x,y,5+p*18,['#ffbd67','#50b9fa','#bc7cff'][i],Math.sin(t*2+i)*.08)}let playerP=(window.lapClock||0)/lapSeconds(),py=top+.25*(h*.56)+playerP*(h*.44),pw=perspective(py),px=cx+Math.sin(t*.85)*pw*.2;drawCar(px,py,12+playerP*15,['#53e6bd','#ff6395','#ffc95e','#63bbff'][state.car%4],Math.sin(t*2.3)*.12);window.sceneRAF=requestAnimationFrame(frame)}window.sceneRAF=requestAnimationFrame(frame)}
function gameTick(now){const dt=Math.min(.25,(now-lastTick)/1000);lastTick=now;const scaled=dt*state.speedMult;window.lapClock=(window.lapClock||0)+scaled;state.cash+=scaled*16*rate()/lapSeconds();if(window.lapClock>=lapSeconds()){window.lapClock-=lapSeconds();state.laps++;state.cash+=16*rate();addXp(3);sound('lap');if(state.laps%10===0)state.trophies++;save();const num=$('#view-race .muted');if(num)num.textContent=`${fmt(16*rate())} cash and 3 XP each completed lap`}
const cd=$('#countdown'),prog=$('#lapProgress');if(cd)cd.textContent=Math.max(0,lapSeconds()-(window.lapClock||0)).toFixed(1)+'s';if(prog)prog.style.width=((window.lapClock||0)/lapSeconds()*100)+'%';
if(state.champ!==null){champTimer+=scaled;const tier=tiers[state.champ],player=tier.laps*lapSeconds(),rival=tier.laps*Math.max(11,lapSeconds()*(1.15-state.champ*.035));if(champTimer>=Math.min(player,rival)){if(player<=rival){state.cash+=tier.reward;state.trophies+=tier.trophies*(1+state.prestige*.15);state.won.push(state.champ);state.unlockedTier=Math.max(state.unlockedTier,Math.min(4,state.champ+1));state.collection[(state.champ*3+7)%cars.length]=(state.collection[(state.champ*3+7)%cars.length]||0)+1;addXp(tier.trophies);notify(`🏆 ${tier.name} won! Bonus pack & $${fmt(tier.reward)}!`);sound('win')}else{notify('Rival took the win. Upgrade your ride and race again.');sound('tap')}state.champ=null;champTimer=0;save();render()}}
const cashEl=$('#cashBalance'),trophyEl=$('#trophyBalance'),lapEl=$('#lapCount');if(cashEl)cashEl.textContent='$'+fmt(state.cash);if(trophyEl)trophyEl.textContent=fmt(state.trophies);if(lapEl)lapEl.textContent=fmt(state.laps);if(now%3000<250)save();requestAnimationFrame(gameTick)}
// Catch up a maximum of 12 hours from the saved timestamp.
{const away=Math.min(12*3600,Math.max(0,(Date.now()-(state.last||Date.now()))/1000));if(away>8){const earned=away/lapSeconds()*16*rate();state.cash+=earned;state.laps+=Math.floor(away/lapSeconds());addXp(Math.floor(away*0.18));setTimeout(()=>notify(`Welcome back! Your crew earned $${fmt(earned)} while you were away.`),350)}}
render();requestAnimationFrame(gameTick);
</script></body></html>
