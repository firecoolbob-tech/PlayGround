];
const SKINS=[
 {id:'metallic',name:'Metallic Flake',rarity:'Uncommon',price:750,color:'#c3d3e2',bonus:.02},
 {id:'pearl',name:'Pearl Clear-Coat',rarity:'Rare',price:3000,color:'#f2e8ff',bonus:.04},
 {id:'chrome',name:'Liquid Chrome',rarity:'Epic',price:12000,color:'#cfe9ff',bonus:.06},
 {id:'aurora',name:'Aurora Shift',rarity:'Epic',price:45000,color:'#7dffd4',bonus:.08},
 {id:'holo',name:'Holographic',rarity:'Legendary',price:150000,color:'#ff9df5',bonus:.11},
 {id:'prism',name:'Prismatic Void',rarity:'Mythic',price:500000,color:'#d9a6ff',bonus:.15}

const TABS=[['race','🏁 Race'],['champ','🏆 Championships'],['upgrades','🔧 Upgrades'],['packs','🎴 Card Packs'],['garage','🚗 Garage'],['worlds','🌍 21 Worlds']];
const RARITIES=['Common','Rare','Epic','Legendary'];
const MAX_LEVEL=40;
const SAVE_KEY='pitlane-save-v2';
const OLD_KEY='pitlane-save';

function freshState(){return {version:2,cash:650,trophies:0,xp:0,level:1,laps:0,world:0,car:0,upgrades:{speed:0,accel:0,grip:0,nitro:0,payout:0},collection:{0:1},skins:[],skin:null,prestige:0,unlockedTier:0,won:[],worlds:[0],speedMult:1,follow:true,sound:true,last:Date.now(),champ:null,packsOpened:0,totalEarned:0};}
function num(v,def,min=0,max=1e15){const n=Number(v);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):def}
function loadState(){
 let raw=null;try{raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem(OLD_KEY)}catch{}
 let p={};try{p=JSON.parse(raw||'{}')}catch{}
 const s={...freshState(),...(p&&typeof p==='object'?p:{})};
 const parsedCash=Number(p.cash);
 s.cash=(Number.isFinite(parsedCash)&&parsedCash>=0)?Math.min(1e15,parsedCash):650;
 s.trophies=Math.floor(num(s.trophies,0,0,1e9));
 s.xp=Math.floor(num(s.xp,0,0,1e12));
 s.level=Math.floor(num(s.level,1,1,10000));
 s.laps=Math.floor(num(s.laps,0,0,1e12));
 s.world=Math.floor(num(s.world,0,0,WORLDS.length-1));
 s.car=Math.floor(num(s.car,0,0,CARS.length-1));
 s.prestige=Math.floor(num(s.prestige,0,0,999));
 s.unlockedTier=Math.floor(num(s.unlockedTier,0,0,TIERS.length-1));
 s.speedMult=[1,2,4].includes(Number(s.speedMult))?Number(s.speedMult):1;
 s.follow=s.follow!==false;s.sound=s.sound!==false;
 s.last=num(s.last,Date.now(),0,Date.now()+60000);
 s.packsOpened=Math.floor(num(s.packsOpened,0,0,1e9));
 s.totalEarned=num(s.totalEarned,0,0,1e15);
 s.upgrades={...freshState().upgrades,...(p.upgrades||{})};
 UPGRADES.forEach(u=>{s.upgrades[u.key]=Math.floor(num(s.upgrades[u.key],0,0,MAX_LEVEL))});
 const col={};
 if(p.collection&&typeof p.collection==='object')Object.entries(p.collection).forEach(([k,v])=>{const i=Number(k);const n=Math.floor(num(v,0,0,9999));if(Number.isInteger(i)&&i>=0&&i<CARS.length&&n>0)col[i]=n});
 if(!col[0])col[0]=1;
 s.collection=col;
 if(!col[s.car])s.car=Number(Object.keys(col)[0])||0;
 let ws=Array.isArray(p.worlds)?p.worlds.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<WORLDS.length):[0];
 if(!ws.includes(0))ws.push(0);
 if(Number.isInteger(s.world)&&!ws.includes(s.world))ws.push(s.world);
 s.worlds=[...new Set(ws)].sort((a,b)=>a-b);
 s.won=Array.isArray(p.won)?[...new Set(p.won.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<TIERS.length))]:[];
 s.unlockedTier=Math.max(s.unlockedTier,...s.won.map(i=>Math.min(TIERS.length-1,i+1)));
 if(typeof p.skins==='number')s.skins=SKINS.slice(0,Math.min(SKINS.length,Math.floor(p.skins))).map(x=>x.id);
 else if(Array.isArray(p.skins))s.skins=[...new Set(p.skins.filter(id=>SKINS.some(x=>x.id===id)))];
 else s.skins=[];
 s.skin=s.skins.includes(p.skin)?p.skin:(s.skins[0]||null);
 if(p.champ&&typeof p.champ==='object'){
  const c=p.champ,ti=Number(c.tier),el=Number(c.elapsed),pt=Number(c.playerTotal),rt=Number(c.rivalTotal);
  s.champ=(Number.isInteger(ti)&&ti>=0&&ti<TIERS.length&&Number.isFinite(el)&&el>=0&&Number.isFinite(pt)&&pt>0&&Number.isFinite(rt)&&rt>0)?{tier:ti,elapsed:el,playerTotal:pt,rivalTotal:rt,won:!!c.won,rivalLap:num(c.rivalLap,TIERS[ti].rivalLap,0,999)}:null;
 }else s.champ=null;
 return s;
}

const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const fmt=n=>Math.floor(Math.max(0,Number(n)||0)).toLocaleString('en-US');
function short(n){n=Math.max(0,Number(n)||0);if(n>=1e12)return (n/1e12).toFixed(2)+'T';if(n>=1e9)return (n/1e9).toFixed(2)+'B';if(n>=1e6)return (n/1e6).toFixed(2)+'M';if(n>=1e4)return (n/1e3).toFixed(1)+'K';return fmt(n)}
const cash=n=>'$'+short(n);
function cashRate(n){n=Math.max(0,Number(n)||0);if(n<10)return '$'+n.toFixed(2);if(n<1000)return '$'+n.toFixed(1);return cash(n)}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=v=>Math.round(amt>0?v+(255-v)*amt:v*(1+amt));return `rgb(${f(r)},${f(g)},${f(b)})`}
const worldCost=i=>i<=0?0:Math.round(300*Math.pow(1.55,i-1));
const worldMult=(i=state.world)=>1+i*.07;
const xpNeeded=()=>state.level*100;
function carStars(i){return Math.min(5,Math.floor((state.collection[i]||0)/3))}
function activeSkin(){return SKINS.find(s=>s.id===state.skin)||null}
function lapTime(){
 const car=CARS[state.car]||CARS[0],u=state.upgrades,st=carStars(state.car);
 return Math.max(6.5,30-car.speed*.55-u.speed*.85-u.accel*.65-u.grip*.38-u.nitro*.22-st*.25);
}
function payoutMult(){const u=state.upgrades,sk=activeSkin();return (1+u.payout*.15)*(1+state.prestige*.2)*(1+carStars(state.car)*.06)*(1+(sk?sk.bonus:0))}
function cashPerLap(){const car=CARS[state.car]||CARS[0];return (20+car.payout*2.2)*payoutMult()*worldMult()}
function perSecond(){return cashPerLap()/lapTime()}
function upgradeCost(key,n=1){const u=UPGRADES.find(x=>x.key===key);let total=0,start=state.upgrades[key]||0;for(let i=0;i<n;i++)total+=u.base*Math.pow(u.growth,start+i);return Math.floor(total)}
function packOdds(p){let[c,r,e,l]=p.weights;const luck=Math.min(24,state.prestige*3);c=Math.max(2,c-luck);e+=luck*.6;l+=luck*.4;const t=c+r+e+l;return [c/t*100,r/t*100,e/t*100,l/t*100]}
function rollRarity(p){const w=packOdds(p),roll=Math.random()*100;let acc=0;for(let i=0;i<w.length;i++){acc+=w[i];if(roll<acc)return RARITIES[i]}return 'Legendary'}
function randomCarOfRarity(rarity){const pool=CARS.map((c,i)=>({c,i})).filter(x=>x.c.rarity===rarity);const use=pool.length?pool:CARS.map((c,i)=>({c,i}));return use[Math.floor(Math.random()*use.length)].i}
function grantCard(index,rarity){const before=state.collection[index]||0,sb=Math.floor(before/3);state.collection[index]=before+1;const sa=Math.floor((before+1)/3);return {index,rarity,isNew:before===0,starUp:sa>sb,count:before+1,stars:sa}}
function bonusRarity(tier){return ['Rare','Epic','Epic','Legendary','Legendary'][tier]||'Legendary'}
const scene={canvas:null,ctx:null,w:0,h:0,dpr:1};
function wrap(v,m){return ((v%m)+m)%m}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));g.beginPath();if(g.roundRect){g.roundRect(x,y,w,h,r);return}g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawScene(t){
 const c=document.getElementById('raceCanvas');if(!c)return;
 if(c!==scene.canvas){scene.canvas=c;scene.ctx=c.getContext('2d');scene.w=0;scene.h=0}
 const rect=c.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
 const w=Math.max(1,Math.round(rect.width)),h=Math.max(1,Math.round(rect.height));
 if(scene.w!==w||scene.h!==h||scene.dpr!==dpr){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);scene.w=w;scene.h=h;scene.dpr=dpr;scene.ctx.setTransform(dpr,0,0,dpr,0,0)}
 const g=scene.ctx;g.clearRect(0,0,w,h);
 const world=WORLDS[state.world]||WORLDS[0];
 drawSky(g,w,h,world,t);drawScenery(g,w,h,world,t);
 if(state.follow)drawFollow(g,w,h,world,t);else drawTopDown(g,w,h,world,t);
}
function drawSky(g,w,h,world,t){
 const grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,world.sky[0]);grad.addColorStop(.62,world.sky[1]);grad.addColorStop(1,'#050d14');g.fillStyle=grad;g.fillRect(0,0,w,h);
 const gx=w*.7,gy=h*.23,rad=g.createRadialGradient(gx,gy,0,gx,gy,w*.5);rad.addColorStop(0,rgba(world.accent,.26));rad.addColorStop(1,'transparent');g.fillStyle=rad;g.fillRect(0,0,w,h);
}
function drawScenery(g,w,h,world,t){
 const horizon=h*.46;
 if(['city','cyber','rain'].includes(world.type))drawCity(g,w,h,world,t,horizon);
 else if(world.type==='desert'||world.type==='mars')drawDesert(g,w,h,world,t,horizon);
 else if(world.type==='alpine'||world.type==='blossom')drawMountains(g,w,h,world,t,horizon,world.type==='blossom');
 else if(world.type==='ice')drawIce(g,w,h,world,t,horizon);
 else if(world.type==='coast'||world.type==='sunset')drawCoast(g,w,h,world,t,horizon,world.type==='sunset');
 else if(world.type==='volcano')drawVolcano(g,w,h,world,t,horizon);
 else if(world.type==='port')drawPort(g,w,h,world,t,horizon);
 else if(world.type==='jungle')drawJungle(g,w,h,world,t,horizon);
 else if(world.type==='moon')drawMoon(g,w,h,world,t,horizon);
 else if(world.type==='candy')drawCandy(g,w,h,world,t,horizon);
 else if(world.type==='gold')drawGold(g,w,h,world,t,horizon);
 else if(world.type==='crystal')drawCrystal(g,w,h,world,t,horizon);
 else if(world.type==='autumn')drawAutumn(g,w,h,world,t,horizon);
 else if(world.type==='sky')drawClouds(g,w,h,world,t,horizon);
 else if(world.type==='haunted')drawHaunted(g,w,h,world,t,horizon);
 else if(world.type==='prism')drawPrism(g,w,h,world,t,horizon);
}
function drawCity(g,w,h,world,t,horizon){
 for(let i=0;i<18;i++){const bw=w/14*(.55+((i*7)%5)*.11),bh=h*(.09+((i*13)%9)/9*.23),x=wrap(i*w/13-t*5,w+150)-75;g.fillStyle='rgba(3,10,18,.9)';g.fillRect(x,horizon-bh,bw,bh);g.fillStyle=rgba(world.accent,.2);for(let yy=horizon-bh+9;yy<horizon-7;yy+=13)for(let xx=x+4;xx<x+bw-4;xx+=10)if(((xx+yy+i)|0)%3)g.fillRect(xx,yy,3,4)}
 if(world.type==='cyber'){g.strokeStyle=rgba(world.accent,.12);g.lineWidth=1;for(let x=0;x<w;x+=34){g.beginPath();g.moveTo(w*.5+(x-w*.5)*.4,horizon);g.lineTo(x,h);g.stroke()}for(let y=horizon;y<h;y+=22){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}g.strokeStyle=rgba(world.accent,.4);for(let i=0;i<3;i++){g.beginPath();g.ellipse(w*.5,horizon+8+i*13,w*(.1+i*.08),h*(.02+i*.014),0,0,Math.PI*2);g.stroke()}}
 if(world.type==='rain'){g.fillStyle='rgba(180,220,255,.08)';g.fillRect(0,horizon-6,w,h)}
}
function drawDesert(g,w,h,world,t,horizon){
 const sun=g.createRadialGradient(w*.78,horizon-42,2,w*.78,horizon-42,80);sun.addColorStop(0,'rgba(255,236,180,.75)');sun.addColorStop(1,'transparent');g.fillStyle=sun;g.fillRect(0,0,w,h);
 const tones=world.type==='mars'?['#4a1c17','#67281d','#7e3323']:['#513722','#76502e','#94663a'];
 tones.forEach((col,i)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,horizon+i*8);g.quadraticCurveTo(w*(.18+i*.12),horizon-42-i*10,w*.45,horizon+i*8);g.quadraticCurveTo(w*(.7+i*.09),horizon+25-i*12,w,horizon-4+i*10);g.lineTo(w,h);g.lineTo(0,h);g.fill()});
 g.fillStyle=world.type==='mars'?'#5b241b':'#6b4729';for(let i=0;i<4;i++){const x=w*(.08+i*.24),bw=w*.13,bh=h*.09;g.fillRect(x,horizon-bh,bw,bh);g.fillRect(x+bw*.18,horizon-bh*1.45,bw*.58,bh*.45)}
}
function drawMountains(g,w,h,world,t,horizon,blossom){
 for(let i=0;i<6;i++){const x=w*(i/5-.06),peak=horizon-h*(.12+(i%3)*.06),base=horizon+4;g.fillStyle=i%2?'#243444':'#1b2a39';g.beginPath();g.moveTo(x-w*.14,base);g.lineTo(x,peak);g.lineTo(x+w*.16,base);g.fill();g.fillStyle='rgba(235,248,255,.82)';g.beginPath();g.moveTo(x-w*.035,peak+h*.035);g.lineTo(x,peak);g.lineTo(x+w*.04,peak+h*.035);g.fill()}
 if(blossom){for(let i=0;i<9;i++)tree(g,w*(.06+i*.11),horizon+6,h*.055,'#7c4b66','#ff9ebd')}else for(let i=0;i<13;i++)pine(g,w*(.03+i*.08),horizon+5,h*(.035+(i%3)*.008),'#1a3e34')
}
function drawIce(g,w,h,world,t,horizon){
 drawMountains(g,w,h,world,t,horizon,false);
 g.fillStyle='rgba(150,220,255,.13)';g.fillRect(0,horizon,w,h-horizon);
 for(let i=0;i<7;i++){g.strokeStyle='rgba(210,245,255,.18)';g.beginPath();g.moveTo(w*(.05+i*.15),horizon);g.lineTo(w*(.12+i*.15),h);g.stroke()}
}
function drawCoast(g,w,h,world,t,horizon,sunset){
 const sea=g.createLinearGradient(0,horizon,0,h);sea.addColorStop(0,sunset?'#8a4744':'#176a76');sea.addColorStop(1,'#08222c');g.fillStyle=sea;g.fillRect(0,horizon,w,h-horizon);
 const sun=g.createRadialGradient(w*.72,horizon-38,2,w*.72,horizon-38,72);sun.addColorStop(0,sunset?'rgba(255,220,150,.95)':'rgba(255,245,200,.7)');sun.addColorStop(1,'transparent');g.fillStyle=sun;g.fillRect(0,0,w,h);
 for(let i=0;i<8;i++){g.strokeStyle=`rgba(255,220,170,${.08+i*.01})`;g.beginPath();g.moveTo(w*.72-30-i*8,horizon+8+i*5);g.lineTo(w*.72+30+i*8,horizon+8+i*5);g.stroke()}
 g.fillStyle='#d8eef2';g.fillRect(w*.87,horizon-h*.14,9,h*.14);g.fillStyle='#ffce67';g.fillRect(w*.865,horizon-h*.15,18,6);
 palm(g,w*.08,horizon+18,h*.06,'#1f5a4c');palm(g,w*.17,horizon+28,h*.05,'#246b56');
}
function drawVolcano(g,w,h,world,t,horizon){
 const vg=g.createRadialGradient(w*.52,horizon,0,w*.52,horizon,w*.42);vg.addColorStop(0,'rgba(255,92,40,.45)');vg.addColorStop(1,'transparent');g.fillStyle=vg;g.fillRect(0,0,w,h);
 g.fillStyle='#211514';g.beginPath();g.moveTo(w*.18,h);g.lineTo(w*.43,horizon-h*.18);g.lineTo(w*.57,horizon-h*.18);g.lineTo(w*.85,h);g.fill();
 g.fillStyle='#ff6b36';g.beginPath();g.moveTo(w*.43,horizon-h*.18);g.lineTo(w*.57,horizon-h*.18);g.lineTo(w*.53,horizon-h*.135);g.lineTo(w*.47,horizon-h*.135);g.fill();
 for(let i=0;i<4;i++){g.strokeStyle='rgba(255,110,50,.6)';g.lineWidth=2;g.beginPath();g.moveTo(w*.5,horizon-h*.17);g.quadraticCurveTo(w*(.45+i*.04),horizon-h*.05,w*(.36+i*.07),h);g.stroke()}
 for(let i=0;i<16;i++){const x=wrap(i*67+t*18,w),y=wrap(i*37-t*55,h*.4);g.fillStyle=`rgba(255,${120+i*5},60,${.25+(i%4)*.12})`;g.beginPath();g.arc(x,y,1.2+(i%3),0,Math.PI*2);g.fill()}

function drawPort(g,w,h,world,t,horizon){
 g.fillStyle='#0d2530';g.fillRect(0,horizon,w,h-horizon);
 const cols=['#b45f4d','#3e7f91','#c79a52','#456b86','#8a5b6e'];
 for(let i=0;i<15;i++){const x=wrap(i*w/10-t*4,w+120)-60,y=horizon-h*(.05+(i%4)*.045),bw=w*.075,bh=h*.06;g.fillStyle=cols[i%cols.length];g.fillRect(x,y,bw,bh);g.fillStyle='rgba(0,0,0,.16)';for(let xx=x+3;xx<x+bw-2;xx+=6)g.fillRect(xx,y+2,2,bh-4)}
 g.strokeStyle='#394b52';g.lineWidth=3;g.beginPath();g.moveTo(w*.72,horizon-h*.2);g.lineTo(w*.72,horizon);g.moveTo(w*.72,horizon-h*.2);g.lineTo(w*.94,horizon-h*.12);g.stroke();
}
function drawJungle(g,w,h,world,t,horizon){
 g.fillStyle='#0c2a1c';g.fillRect(0,horizon,w,h-horizon);
 g.fillStyle='#223d2a';for(let i=0;i<5;i++){const x=w*(.3+i*.1),bw=w*.09;g.fillRect(x,horizon-h*(.08+i*.025),bw,h*(.08+i*.025))}
 g.fillStyle='#526b45';for(let i=0;i<4;i++)g.fillRect(w*.32,horizon-h*.13+i*h*.035,w*.36,h*.018);
 for(let i=0;i<9;i++)palm(g,w*(.04+i*.12),horizon+12,h*(.055+(i%3)*.012),'#1f5a3d');
}
function drawMoon(g,w,h,world,t,horizon){
 g.fillStyle='rgba(210,220,255,.55)';for(let i=0;i<70;i++){const x=(i*97)%w,y=(i*53)%(horizon-10);g.fillRect(x,y,1.4,1.4)}
 g.fillStyle='#2a2d3a';g.beginPath();g.arc(w*.78,horizon-58,26,0,Math.PI*2);g.fill();
 g.fillStyle='rgba(160,170,200,.2)';for(let i=0;i<6;i++){g.beginPath();g.ellipse(w*(.1+i*.16),horizon+12+(i%3)*8,18+i*4,5+i,0,0,Math.PI*2);g.fill()}
 g.fillStyle='#a9b7cc';g.beginPath();g.arc(w*.2,horizon-9,20,Math.PI,0);g.fill();g.fillStyle='#6e7d92';g.fillRect(w*.2-6,horizon-9,12,14);
}
function drawCandy(g,w,h,world,t,horizon){
 g.fillStyle='#ff9fce';g.beginPath();g.moveTo(0,horizon);g.quadraticCurveTo(w*.2,horizon-55,w*.45,horizon);g.quadraticCurveTo(w*.7,horizon+35,w,horizon-20);g.lineTo(w,h);g.lineTo(0,h);g.fill();
 g.fillStyle='#c96fa8';g.beginPath();g.moveTo(0,horizon+20);g.quadraticCurveTo(w*.3,horizon-18,w*.6,horizon+20);g.quadraticCurveTo(w*.82,horizon+42,w,horizon+14);g.lineTo(w,h);g.lineTo(0,h);g.fill();
 for(let i=0;i<6;i++){const x=w*(.1+i*.16),y=horizon+8;g.strokeStyle='#f5d9e8';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x,y-28);g.stroke();g.fillStyle=i%2?'#ffec8a':'#8fe8ff';g.beginPath();g.arc(x,y-34,9,0,Math.PI*2);g.fill()}
}
function drawGold(g,w,h,world,t,horizon){
 g.fillStyle='rgba(255,215,120,.16)';for(let i=0;i<4;i++){g.beginPath();g.moveTo(w*(.18+i*.2),0);g.lineTo(w*(.08+i*.2),h);g.lineTo(w*(.23+i*.2),h);g.lineTo(w*(.3+i*.2),0);g.fill()}
 g.fillStyle='#3b3018';for(let i=0;i<6;i++){const x=w*(.05+i*.18);g.fillRect(x,horizon-h*.18,w*.035,h*.18);g.fillStyle='#6f5a28';g.fillRect(x-3,horizon-h*.2,w*.035+6,5);g.fillStyle='#3b3018'}
}
function drawCrystal(g,w,h,world,t,horizon){
 g.fillStyle='#0a2029';g.fillRect(0,horizon,w,h-horizon);
 for(let i=0;i<10;i++){const x=w*(.05+i*.1),base=horizon+12,ht=h*(.05+(i%4)*.035);g.fillStyle=i%2?'#2b7f83':'#3b5f7c';g.beginPath();g.moveTo(x,base);g.lineTo(x+7,base-ht);g.lineTo(x+15,base);g.fill();g.fillStyle='rgba(130,255,230,.35)';g.beginPath();g.moveTo(x+3,base);g.lineTo(x+7,base-ht*.8);g.lineTo(x+10,base);g.fill()}
 const glow=g.createRadialGradient(w*.55,horizon+10,0,w*.55,horizon+10,w*.3);glow.addColorStop(0,'rgba(112,255,224,.18)');glow.addColorStop(1,'transparent');g.fillStyle=glow;g.fillRect(0,0,w,h);
}
function drawAutumn(g,w,h,world,t,horizon){
 for(let i=0;i<11;i++)tree(g,w*(.03+i*.095),horizon+8,h*(.05+(i%3)*.012),'#5a3a25',i%3?'#c96b32':'#d99a3d');
}
function drawClouds(g,w,h,world,t,horizon){
 for(let i=0;i<9;i++){const x=wrap(i*w/7-t*7,w+180)-90,y=h*(.12+(i%4)*.08);g.fillStyle=`rgba(235,246,255,${.1+(i%3)*.05})`;g.beginPath();g.ellipse(x,y,44+i*7,13+i*2,0,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(x+25,y-8,28+i*4,12+i*2,0,0,Math.PI*2);g.fill()}
 g.fillStyle='rgba(255,255,255,.1)';g.fillRect(0,horizon,w,h-horizon);
}
function drawHaunted(g,w,h,world,t,horizon){
 g.fillStyle='rgba(220,230,255,.5)';for(let i=0;i<50;i++)g.fillRect((i*83)%w,(i*47)%(horizon-20),1.2,1.2);
 g.fillStyle='rgba(200,210,235,.18)';g.beginPath();g.arc(w*.78,horizon-86,34,0,Math.PI*2);g.fill();
 for(let i=0;i<8;i++){const x=w*(.05+i*.13),base=horizon+14;g.strokeStyle='#2b2532';g.lineWidth=4;g.beginPath();g.moveTo(x,base);g.lineTo(x,base-h*.11);g.moveTo(x,base-h*.09);g.lineTo(x-18,base-h*.15);g.moveTo(x,base-h*.08);g.lineTo(x+20,base-h*.14);g.stroke();g.fillStyle='#ffca6a';g.beginPath();g.arc(x+20,base-h*.14,3,0,Math.PI*2);g.fill();g.fillStyle='rgba(255,202,106,.2)';g.beginPath();g.arc(x+20,base-h*.14,10,0,Math.PI*2);g.fill()}
 g.fillStyle='rgba(200,210,235,.08)';g.fillRect(0,horizon+10,w,h-horizon);
}
function drawPrism(g,w,h,world,t,horizon){
 const cols=['#ff7a8a','#ffca6a','#8affd6','#6fd9ff','#b48cff','#ff9df5'];
 for(let i=0;i<6;i++){g.strokeStyle=rgba(cols[i],.26);g.lineWidth=10;g.beginPath();g.arc(w*.5,horizon+30,90+i*26,Math.PI,0);g.stroke()}
 g.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<80;i++)g.fillRect((i*97)%w,(i*61)%h,1.2,1.2);
}
function tree(g,x,y,s,trunk,leaf){g.strokeStyle=trunk;g.lineWidth=Math.max(1,s*.16);g.beginPath();g.moveTo(x,y);g.lineTo(x,y-s*.75);g.stroke();g.fillStyle=leaf;for(let i=0;i<3;i++){g.beginPath();g.arc(x+(i-1)*s*.22,y-s*.72-(i%2)*s*.12,s*.3,0,Math.PI*2);g.fill()}}
function pine(g,x,y,s,col){g.fillStyle=col;for(let i=0;i<3;i++){g.beginPath();g.moveTo(x,y-s*(.25+i*.25));g.lineTo(x-s*(.28-i*.06),y-s*(.05+i*.2));g.lineTo(x+s*(.28-i*.06),y-s*(.05+i*.2));g.fill()}g.fillStyle='#2a2018';g.fillRect(x-s*.04,y-s*.05,s*.08,s*.12)}
function palm(g,x,y,s,col){g.strokeStyle=col;g.lineWidth=Math.max(1,s*.1);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-s*.15,y-s*.55,x+s*.04,y-s);g.stroke();g.fillStyle=col;for(let i=0;i<5;i++){g.beginPath();g.ellipse(x+s*.04+Math.cos(i*1.2)*s*.3,y-s+Math.sin(i*1.2)*s*.14,s*.35,s*.09,i*.5,0,Math.PI*2);g.fill()}}
function drawFollow(g,w,h,world,t){
 const horizon=h*.46,top=horizon+3,bottom=h+26,cx=w*.52,topW=w*.16,bottomW=w*(state.follow?.64:.8);
 const ground=g.createLinearGradient(0,horizon,0,h);ground.addColorStop(0,'rgba(8,18,25,.95)');ground.addColorStop(1,'#071017');g.fillStyle=ground;g.fillRect(0,horizon,w,h-horizon);
 g.beginPath();g.moveTo(cx-topW/2,top);g.lineTo(cx+topW/2,top);g.lineTo(cx+bottomW/2,bottom);g.lineTo(cx-bottomW/2,bottom);g.closePath();
 const road=g.createLinearGradient(0,top,0,bottom);road.addColorStop(0,world.road);road.addColorStop(.35,shade(world.road,.08));road.addColorStop(1,'#0d161d');g.fillStyle=road;g.fill();g.strokeStyle=rgba(world.accent,.65);g.lineWidth=2;g.stroke();
 const perspective=y=>topW/2+(bottomW-topW)/2*clamp((y-top)/(bottom-top),0,1);
 g.save();g.beginPath();g.moveTo(cx-topW/2,top);g.lineTo(cx+topW/2,top);g.lineTo(cx+bottomW/2,bottom);g.lineTo(cx-bottomW/2,bottom);g.closePath();g.clip();
 for(let i=0;i<13;i++){const p=wrap(i/13+t*.23*state.speedMult,1),y=top+p*(bottom-top),ww=perspective(y);g.fillStyle=i%2?'rgba(255,255,255,.045)':rgba(world.accent,.08);g.fillRect(cx-ww*.46,y,ww*.92,Math.max(1,p*2.4))}
 for(let i=0;i<9;i++){const p=wrap(i/9+t*.17*state.speedMult,1),y=top+p*(bottom-top),ww=perspective(y);g.strokeStyle='rgba(220,245,235,.5)';g.lineWidth=Math.max(1,p*2);g.setLineDash([10*p+2,16*p+5]);g.beginPath();g.moveTo(cx,y);g.lineTo(cx,y+15*p);g.stroke()}

function tick(now){

 const step=dt*state.speedMult;lapClock+=step;
 const earn=step*perSecond();state.cash=Math.min(1e15,state.cash+earn);state.totalEarned+=earn;
 let guard=0;
 while(lapClock>=lapTime()&&guard<5){
  const lt=lapTime();lapClock-=lt;state.laps++;const pay=cashPerLap();state.cash=Math.min(1e15,state.cash+pay);state.totalEarned+=pay;addXp(4);
  if(state.laps%5===0){state.trophies++;showToast('Trophy earned! +1 ✦','gold')}
  sound('lap');guard++;
 }
 if(state.champ)updateChamp(step);

 if(state.sound)getAudio();
 const d=btn.dataset;
 if(d.tab){tab=d.tab;render();sound('tap');return}
 if(d.speed){state.speedMult=Number(d.speed);save();sound('tap');render();return}
 if(d.buy){buyMode=Number(d.buy);render();return}
 if(d.action==='camera'){state.follow=!state.follow;save();sound('tap');render();return}
 if(d.action==='sound'){state.sound=!state.sound;save();if(state.sound)sound('tap');render();return}
 if(d.action==='abandon'){if(state.champ){state.champ=null;save();sound('tap');render();showToast('Championship abandoned. Your upgrades are waiting.','info')}return}
 if(d.action==='prestige'){if(state.unlockedTier<3)return showToast('Unlock Elite Tour before prestiging.','error');showPrestigeConfirm();return}
 if(d.upgrade){buyUpgrade(d.upgrade);return}
 if(d.champ!==undefined){startChamp(Number(d.champ));return}
 if(d.pack!==undefined){openPack(Number(d.pack),d.currency);return}
 if(d.equip!==undefined){equipCar(Number(d.equip));return}
 if(d.world!==undefined){selectWorld(Number(d.world));return}
 if(d.skin){buySkin(d.skin);return}
});
const modalEl=$('#modal');if(modalEl)modalEl.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);
const offline=offlineEarnings();
render();
if(offline){save();setTimeout(()=>showOffline(offline),650)}
lastFrame=performance.now();
requestAnimationFrame(tick);

</script>
